name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Release:
    name: 🚀 Release
    # A manual run publishes whatever the selected branch holds, so only allow it from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release-please--branches--main'))
    runs-on: { group: github-public-amd64 }
    # The npm Trusted Publishing token is minted in this job. The environment is where its
    # reviewers are enforced, and the trusted publisher on npmjs.com can pin it, so a copy of
    # this workflow on any other branch cannot mint a usable token.
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing and provenance
      # Read is enough: the job only publishes to npm. release-please (release-pr.yml) creates the tag and the GitHub release.
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Publish package
        run: yarn npm publish
