name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: write # required for committing the version bump

jobs:
  Release:
    name: 🚀 Release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged && startsWith(github.head_ref, 'release-please--branches--main')
    runs-on: { group: github-public-amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: yarn install --immutable

      # Pack once, check that tarball, and publish the same file, so the
      # artifact that reaches npm is the one that was checked.
      - name: Pack package
        run: yarn pack -o package.tgz

      - name: Check packed manifest has no install scripts
        run: node scripts/check-packed-manifest.mjs package.tgz

      # npm publishes a tarball as-is; `yarn npm publish` always packs afresh.
      # npm >= 11.5.1 (bundled with Node 24) authenticates through OIDC
      # trusted publishing and generates provenance.
      - name: Publish package
        run: npm publish ./package.tgz --access public --provenance
