name: Release PR

on:
  push:
    branches:
      - main

# The org no longer lets GITHUB_TOKEN create pull requests, so release-please
# authenticates with a GitHub App installation token instead.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: { group: github-public-amd64 }
    # stream-node-release-bot was uninstalled in the 2026-11-20 org app cleanup; the Release PR
    # is now opened by getstream-sdk-bot, like the other server-side SDKs. Its key lives only
    # in the sdk-bot environment, which deploys from main.
    environment: sdk-bot
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23lioh9qYGjBIp9nsK
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
